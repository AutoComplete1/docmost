name: Sync upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge docmost/docmost main
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/docmost/docmost.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date"
            exit 0
          fi
          git merge --no-edit -m "chore: merge upstream docmost/main" FETCH_HEAD
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.merge.outputs.merged == 'true'

      - name: Verify build
        if: steps.merge.outputs.merged == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha

      - name: Push and publish
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:main
          gh workflow run docker-publish.yml --ref main
